name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install
        run: bun install --frozen-lockfile
        env:
          MOTION_TOKEN: ${{ secrets.MOTION_TOKEN }}

      - name: Check
        run: bun check

      - name: Test
        run: bun run test

      - name: Install Linux Screens build dependencies
        run: sudo apt-get update && sudo apt-get install --yes gcc pkg-config libx11-dev libxtst-dev libjpeg-dev

      - name: Build CLI
        run: bun run build:cli
        env:
          NODE_OPTIONS: --max-old-space-size=4096
